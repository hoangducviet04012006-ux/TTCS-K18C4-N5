<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Truy xuất nguồn gốc · AgriTrace</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#f4f8f5;color:#18352a;font-family:system-ui,sans-serif}.wrap{max-width:820px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #dbe7df;border-radius:14px;padding:clamp(16px,4vw,28px);margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{padding:12px;background:#f5faf6;border-radius:8px;overflow-wrap:anywhere}.muted{color:#63766a}.error{color:#b42318}</style></head><body><main class="wrap"><header><h1>AgriTrace</h1><p class="muted">Truy xuất nguồn gốc nông sản</p></header><section class="card"><h2>Thông tin lô hàng</h2><p id="status" role="status">Đang tải thông tin...</p><div id="content" hidden><div class="grid"><div class="item"><b>Mã lô</b><div id="code"></div></div><div class="item"><b>Sản phẩm</b><div id="product"></div></div><div class="item"><b>Ngày thu hoạch</b><div id="date"></div></div><div class="item"><b>Trạng thái</b><div id="batch-status"></div></div><div class="item"><b>Địa điểm</b><div id="location"></div></div><div class="item"><b>Vùng trồng</b><div id="farm"></div></div></div><h3>Lịch sử nguồn gốc</h3><ul id="roots"></ul><p class="muted">Trang chỉ hiển thị thông tin truy xuất công khai, không cung cấp dữ liệu tài khoản hoặc chức năng quản trị.</p></div></section></main><script>
(async()=>{const status=document.getElementById("status");const pathCode=decodeURIComponent(location.pathname.replace(/\\/+$/,"").split("/").pop()||"");const code=new URLSearchParams(location.search).get("batch_code")||pathCode;const base=window.AGRITRACE_CONFIG&&window.AGRITRACE_CONFIG.apiBase;if(!base){status.className="error";status.textContent="Chưa cấu hình API truy xuất cho môi trường này.";return;}if(!code){status.className="error";status.textContent="Đường dẫn không có mã lô.";return;}try{const r=await fetch(base.replace(/\\/$/,"")+"/public/trace/"+encodeURIComponent(code),{headers:{Accept:"application/json"}});const d=await r.json();if(!r.ok)throw Error(d.detail||"Không tìm thấy lô.");const put=(id,v)=>document.getElementById(id).textContent=v||"Chưa có thông tin công khai";put("code",d.batch_code);put("product",d.product_name);put("date",d.harvest_date);put("batch-status",d.status);put("location",d.origin&&d.origin.location);put("farm",d.origin&&d.origin.farm_name);const list=document.getElementById("roots");for(const item of d.root_batches||[]){const li=document.createElement("li");li.textContent=[item.batch_code,item.product_name,item.harvest_date,item.location,item.farm_name].filter(Boolean).join(" · ");list.appendChild(li);}if(!list.children.length){const li=document.createElement("li");li.textContent="Chưa có dữ liệu lô nguồn bổ sung.";list.appendChild(li);}document.getElementById("content").hidden=false;status.hidden=true;}catch(e){status.className="error";status.textContent=e.message||"Không thể tải thông tin truy xuất.";}})();
</script></body></html>
