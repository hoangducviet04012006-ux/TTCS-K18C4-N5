<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Truy xuất nguồn gốc · AgriTrace</title><link rel="stylesheet" href="css/style.css"><style>body{margin:0;background:#f4f8f5;color:#18352a;font-family:system-ui,sans-serif}.wrap{max-width:820px;margin:24px auto;padding:16px}.card{background:white;border:1px solid #dbe7df;border-radius:14px;padding:clamp(16px,4vw,28px);margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.item{padding:12px;background:#f5faf6;border-radius:8px;overflow-wrap:anywhere}.muted{color:#63766a}.error{color:#b42318}</style></head><body><main class="wrap"><header><h1>AgriTrace</h1><p class="muted">Truy xuất nguồn gốc nông sản</p></header><section class="card"><h2>Thông tin lô hàng</h2><p id="status" role="status">Đang tải thông tin...</p><div id="content" hidden><div class="grid"><div class="item"><b>Mã lô</b><div id="code"></div></div><div class="item"><b>Sản phẩm</b><div id="product"></div></div><div class="item"><b>Ngày thu hoạch</b><div id="date"></div></div><div class="item"><b>Trạng thái</b><div id="batch-status"></div></div><div class="item"><b>Địa điểm</b><div id="location"></div></div><div class="item"><b>Vùng trồng</b><div id="farm"></div></div></div><h3>Lịch sử nguồn gốc</h3><ul id="roots"></ul><p class="muted">Trang chỉ hiển thị thông tin truy xuất công khai, không cung cấp dữ liệu tài khoản hoặc chức năng quản trị.</p></div></section></main><script src="js/trace.js?v=1" defer></script></body></html>
