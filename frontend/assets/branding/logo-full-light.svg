<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" width="260" height="64" fill="none">
  <defs>
    <linearGradient id="lMainLight" x1="10" y1="56" x2="48" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#103D2B"/>
      <stop offset="60%" stop-color="#277B52"/>
      <stop offset="100%" stop-color="#2E9E66"/>
    </linearGradient>
    <linearGradient id="lSproutLight" x1="8" y1="46" x2="28" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#277B52"/>
      <stop offset="60%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#B6E5A8"/>
    </linearGradient>
    <linearGradient id="lTraceLight" x1="6" y1="14" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6E5A8"/>
      <stop offset="50%" stop-color="#277B52"/>
      <stop offset="100%" stop-color="#103D2B"/>
    </linearGradient>
    <filter id="shadowLight" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#103D2B" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- BIỂU TƯỢNG (Icon bên trái) -->
  <g transform="translate(4, 4) scale(0.87)" filter="url(#shadowLight)">
    <!-- Vòng chuỗi mắt xích -->
    <path d="M 18,18 C 10,25 9,39 16,48 C 22,55 33,57 41,52" 
          stroke="url(#lTraceLight)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
    <path d="M 44,49 C 48,45 52,38 52,28 C 52,18 42,10 32,10" 
          stroke="#277B52" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3.5" fill="none" opacity="0.6"/>

    <!-- Cánh lá chính -->
    <path d="M 32,54 C 32,54 49,43 51,27 C 52,17 44,9 33,7 C 32,18 35,31 32,54 Z" 
          fill="url(#lMainLight)"/>

    <!-- Cánh lá mầm non -->
    <path d="M 32,46 C 30,37 20,38 15,31 C 12,26 15,18 24,14 C 27,22 28,34 32,46 Z" 
          fill="url(#lSproutLight)"/>

    <!-- Gân lá & 3 node mắt xích -->
    <path d="M 32,48 Q 31,31 34,16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
    <circle cx="32" cy="48" r="3.2" fill="#FFFFFF"/>
    <circle cx="32" cy="48" r="1.6" fill="#103D2B"/>
    <circle cx="31.8" cy="32" r="3" fill="#FFFFFF"/>
    <circle cx="31.8" cy="32" r="1.5" fill="#277B52"/>
    <circle cx="33.5" cy="16" r="2.8" fill="#B6E5A8"/>
    <circle cx="33.5" cy="16" r="1.3" fill="#103D2B"/>

    <circle cx="16" cy="48" r="2" fill="#277B52"/>
    <circle cx="18" cy="18" r="2" fill="#52B788"/>
    <circle cx="41" cy="52" r="2" fill="#103D2B"/>
  </g>

  <!-- CHỮ THƯƠNG HIỆU & ĐỊNH DANH (Text bên phải) -->
  <text x="66" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" letter-spacing="-0.03em">
    <tspan fill="#103D2B" font-weight="800" font-size="31">Agri</tspan><tspan fill="#277B52" font-weight="600" font-size="31">Trace</tspan>
  </text>
  <text x="67" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="700" fill="#4B7763" letter-spacing="0.16em">
    TRUY XUẤT NGUỒN GỐC NÔNG SẢN
  </text>
</svg>
