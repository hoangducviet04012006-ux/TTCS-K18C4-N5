<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="favBg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#103D2B"/>
      <stop offset="100%" stop-color="#277B52"/>
    </linearGradient>
    <linearGradient id="favLeaf" x1="8" y1="24" x2="24" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#B6E5A8"/>
    </linearGradient>
  </defs>

  <!-- Nền bo tròn tăng độ tương phản rõ ràng trên mọi nền tab trình duyệt -->
  <rect width="32" height="32" rx="7" fill="url(#favBg)"/>

  <!-- Vòng chuỗi mắt xích liên kết -->
  <path d="M 8,11 C 5,16 6,23 10,26 C 14,29 20,29 23,26" 
        stroke="#B6E5A8" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.9"/>
  <circle cx="8.5" cy="11.5" r="1.5" fill="#B6E5A8"/>
  <circle cx="23" cy="26" r="1.5" fill="#B6E5A8"/>

  <!-- Cánh lá chính vươn lên -->
  <path d="M 16,27 C 16,27 25,20 25,12 C 25,7 21,4 16,3 C 15.5,9 17,16 16,27 Z" 
        fill="#FFFFFF"/>

  <!-- Cánh lá mầm non bên trái -->
  <path d="M 16,23 C 15,18 10,18 8,14 C 7,11 9,7 13.5,6 C 14.5,10 15,16 16,23 Z" 
        fill="url(#favLeaf)"/>

  <!-- Gân lá & 3 node truy xuất nguồn gốc -->
  <path d="M 16,24 L 16.8,8" stroke="#103D2B" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="16" cy="24" r="1.6" fill="#FFFFFF" stroke="#103D2B" stroke-width="0.8"/>
  <circle cx="16.4" cy="16" r="1.5" fill="#B6E5A8" stroke="#103D2B" stroke-width="0.8"/>
  <circle cx="16.8" cy="8" r="1.4" fill="#FFFFFF"/>
</svg>
