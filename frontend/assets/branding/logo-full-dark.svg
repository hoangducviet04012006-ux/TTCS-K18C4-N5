<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 48" width="196" height="48" fill="none">
  <defs>
    <linearGradient id="lMainDark" x1="12" y1="44" x2="38" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#277B52"/>
      <stop offset="60%" stop-color="#38A169"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
    <linearGradient id="lSproutDark" x1="8" y1="36" x2="24" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#52B788"/>
      <stop offset="100%" stop-color="#B6E5A8"/>
    </linearGradient>
    <linearGradient id="lTraceDark" x1="4" y1="12" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6E5A8"/>
      <stop offset="100%" stop-color="#48BB78"/>
    </linearGradient>
  </defs>

  <!-- BIỂU TƯỢNG (Icon thu nhỏ cân đối cho Sidebar) -->
  <g transform="translate(2, 2) scale(0.68)">
    <!-- Vòng chuỗi mắt xích -->
    <path d="M 18,18 C 10,25 9,39 16,48 C 22,55 33,57 41,52" 
          stroke="url(#lTraceDark)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M 44,49 C 48,45 52,38 52,28 C 52,18 42,10 32,10" 
          stroke="#52B788" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" fill="none" opacity="0.8"/>

    <!-- Cánh lá chính -->
    <path d="M 32,54 C 32,54 49,43 51,27 C 52,17 44,9 33,7 C 32,18 35,31 32,54 Z" 
          fill="url(#lMainDark)"/>

    <!-- Cánh lá mầm non -->
    <path d="M 32,46 C 30,37 20,38 15,31 C 12,26 15,18 24,14 C 27,22 28,34 32,46 Z" 
          fill="url(#lSproutDark)"/>

    <!-- Gân lá & 3 node mắt xích -->
    <path d="M 32,48 Q 31,31 34,16" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <circle cx="32" cy="48" r="3.2" fill="#FFFFFF"/>
    <circle cx="32" cy="48" r="1.6" fill="#113E2A"/>
    <circle cx="31.8" cy="32" r="3" fill="#FFFFFF"/>
    <circle cx="31.8" cy="32" r="1.5" fill="#277B52"/>
    <circle cx="33.5" cy="16" r="2.8" fill="#B6E5A8"/>
    <circle cx="33.5" cy="16" r="1.3" fill="#113E2A"/>

    <circle cx="16" cy="48" r="2.2" fill="#B6E5A8"/>
    <circle cx="18" cy="18" r="2.2" fill="#FFFFFF"/>
    <circle cx="41" cy="52" r="2.2" fill="#86EFAC"/>
  </g>

  <!-- CHỮ THƯƠNG HIỆU CHO SIDEBAR TỐI -->
  <text x="50" y="27" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" letter-spacing="-0.03em">
    <tspan fill="#FFFFFF" font-weight="800" font-size="23">Agri</tspan><tspan fill="#B6E5A8" font-weight="600" font-size="23">Trace</tspan>
  </text>
  <text x="51" y="41" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="400" fill="#A4C5AF" letter-spacing="0.01em">
    Quản lý &amp; Truy xuất nông sản
  </text>
</svg>
