name: CI Pipeline - TTCS Nông Sản

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-ci:
    name: Backend Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Cài đặt phụ thuộc
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          pip install -r backend/requirements.txt

      - name: Kiểm tra cú pháp và code style (flake8)
        run: |
          # Dừng build ngay lập tức nếu phát hiện lỗi cú pháp Python hoặc biến chưa định nghĩa
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Kiểm tra các cảnh báo phong cách code (exit-zero để không chặn cảnh báo nhỏ)
          flake8 backend/app --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Chạy toàn bộ bộ kiểm thử tự động (pytest)
        run: |
          pytest backend/tests/ -v

      - name: Báo cáo trạng thái hoàn thành
        if: success()
        run: echo "Toàn bộ kiểm thử tự động và kiểm tra cú pháp đã vượt qua thành công!"
